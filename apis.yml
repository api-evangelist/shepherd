name: Shepherd
description: 'Shepherd is a technology-driven commercial insurance provider offering coverage for the
  builders and operators shaping the physical world. It underwrites Primary Casualty, Excess Casualty,
  and Builder''s Risk lines for the construction and renewable-energy sectors, using data and an in-house
  AI underwriting engine (Nova) to deliver faster indications and modernized risk assessment. Shepherd
  sells through insurance brokers rather than exposing a public developer platform; it has issued 1,500+
  policies across $400B+ in insured volume. This API Evangelist profile was surfaced as a portfolio
  company of Costanoa Ventures and enriched by the pipeline; no public API, developer portal, or
  machine-readable specification was found.'
